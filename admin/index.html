<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrator Login | D’Blossom Model Private Schools</title>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/portal.css">
</head>
<body class="portal-page">
<main class="portal-login"><section class="portal-login-card" aria-labelledby="admin-login-title">
<div class="portal-login-brand"><img src="/logo.jpg" alt="D’Blossom Model Private Schools logo"><h1>D’Blossom Model Private Schools</h1><p>Administrator Portal</p></div>
<h2 id="admin-login-title">Sign in</h2><p>Enter the administrator username and password.</p>
<form id="admin-login-form" novalidate>
<label class="portal-field"><span>Username</span><input name="username" autocomplete="username" required autofocus></label>
<label class="portal-field"><span>Password</span><span class="portal-password"><input name="password" type="password" autocomplete="current-password" required><button class="portal-show" type="button" data-toggle-password>Show</button></span></label>
<div id="admin-login-status" class="portal-status" role="alert" aria-live="polite"></div>
<button class="btn navy-btn portal-login-btn" type="submit" id="admin-login-submit">Login to Admin Dashboard</button>
</form>
<p class="portal-help">Credentials are verified by the Vercel server. They are not stored in this HTML page.</p>
<a class="portal-back" href="/">← Back to school website</a>
</section></main>
<script src="/js/admin-login-html.js"></script>
</body></html>
