<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrator Portal — D'Blossom Model Private Schools</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-role="admin">

<main id="login-view" class="login-main">
<section class="portal-top admin-top">
<a href="/" class="back-home">⌂ Back to Home</a>
<img class="logo" src="/logo.jpg" alt="D'Blossom">
<div class="portal-icon">♜</div>
<h1>Admin Portal</h1>
<p>School Management System</p>
</section>

<section class="login-card">
<img class="portal-logo" src="/logo.jpg" alt="D'Blossom">
<div class="portal-icon-box">♜</div>
<h2>Admin Login</h2>
<p class="muted">Secure administrator access</p>

<form id="login-form">
<div class="field">
<label for="admin-username">Username</label>
<input id="admin-username" name="identifier" autocomplete="username" placeholder="Enter administrator username">
<div class="field-error" data-error="identifier"></div>
</div>
<div class="field">
<label for="admin-password">Password</label>
<input id="admin-password" name="password" type="password" autocomplete="current-password" placeholder="Password">
<div class="field-error" data-error="password"></div>
</div>

<button class="btn navy-btn" type="submit">Login to Dashboard</button>
</form>

<div id="login-notice"></div>
<a href="/" class="muted back-link">⌂ Back to Home</a>
</section>
</main>

<main id="dashboard-view" class="hidden"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const form=document.getElementById("login-form");
  const notice=document.getElementById("login-notice");
  if(!form)return;
  form.addEventListener("submit",async function(event){
    event.preventDefault();
    event.stopPropagation();
    const username=String(form.elements.identifier?.value||"").trim();
    const password=String(form.elements.password?.value||"");
    if(!username||!password)return;
    const button=form.querySelector('button[type="submit"]');
    const old=button?.textContent||"Login to Dashboard";
    if(button){button.disabled=true;button.textContent="Verifying…";}
    try{
      const response=await fetch("/api/admin-login",{
        method:"POST",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({username,password})
      });
      const data=await response.json().catch(function(){return{}});
      if(!response.ok||!data.verified||!data.session){
        throw new Error(data.error||"Incorrect username or password.");
      }
      localStorage.setItem("dblossom_admin_session",data.session);
      window.location.replace("/admin/?dashboard=1");
    }catch(error){
      localStorage.removeItem("dblossom_admin_session");
      if(notice){
        notice.className="notice danger";
        notice.textContent=error?.message||"Administrator login could not be completed.";
      }
    }finally{
      if(button){button.disabled=false;button.textContent=old;}
    }
  },true);
})();
</script>
<script type="module" src="/js/portal.js"></script>
</body>
</html>
