<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator Portal — D'Blossom Model Private Schools</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head><body data-role="admin"><main id="login-view" class="login-main"><section class="portal-top admin-top"><a href="../" class="back-home">⌂ Back to Home</a><img class="logo" src="../logo.jpg" alt="D'Blossom"><div class="portal-icon">♜</div><h1>Admin Portal</h1><p>School Management System</p></section><section class="login-card"><img class="portal-logo" src="../logo.jpg" alt="D'Blossom"><div class="portal-icon-box">♜</div><h2>Admin Login</h2><p class="muted">Secure administrator access</p><form id="login-form" novalidate><label class="field">Username<input data-error-input name="identifier" autocomplete="username" placeholder="DivineBlossom"><span class="error" data-error="identifier"></span></label><label class="field">Password<input data-error-input name="password" type="password" autocomplete="current-password" placeholder="Password"><span class="error" data-error="password"></span></label><button class="btn navy-btn" type="submit">Login to Dashboard</button><div id="login-notice"></div></form><a href="../" class="muted back-link">⌂ Back to Home</a></section></main><main id="dashboard-view" class="hidden"></main><script>
const USERNAME="DivineBlossom",PASSWORD="DBMS";
const loginView=document.getElementById("login-view"),dashboard=document.getElementById("dashboard-view"),form=document.getElementById("login-form"),error=document.getElementById("error"),panel=document.getElementById("panel");
function showDashboard(){loginView.classList.add("hidden");dashboard.classList.remove("hidden")}
form.addEventListener("submit",e=>{e.preventDefault();error.textContent="";if(document.getElementById("username").value.trim()===USERNAME&&document.getElementById("password").value===PASSWORD){sessionStorage.setItem("dblossom_admin","1");showDashboard()}else error.textContent="Incorrect username or password."});
if(sessionStorage.getItem("dblossom_admin")==="1")showDashboard();
document.querySelectorAll(".side button").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".side button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");const title=btn.textContent.replace(/^\S+\s/,"");panel.innerHTML=btn.dataset.page==="home"?'<h2>Welcome, Administrator</h2><p>You are successfully logged in to the D\'Blossom School Management Dashboard.</p>':'<h2>'+title+'</h2><p>This section is ready for the administrator.</p>'});
document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("dblossom_admin");dashboard.classList.add("hidden");loginView.classList.remove("hidden");form.reset()};
</script></body></html>
