<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Portal — D'Blossom Model Private Schools</title><link rel="icon" href="/logo.jpg"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="/css/portal.css"></head>
<body class="portal-page" data-role="teacher">
<main id="login-view" class="portal-login">
<section class="portal-login-card" aria-labelledby="teacher-title">
<div class="portal-login-brand"><a href="/" aria-label="Back to home"><img src="/logo.jpg" alt="D'Blossom Model Private Schools"></a><h1 id="teacher-title">Teacher Portal</h1><p>Students, results, classes and teaching records.</p></div>
<h2>Sign in</h2><p>Use your Staff ID and portal password.</p>
<form id="login-form" novalidate>
<label class="portal-field"><span>Staff ID</span><input name="identifier" autocomplete="username" required autofocus placeholder="Enter staff ID"><small class="field-error" data-error="identifier"></small></label>
<label class="portal-field"><span>Password</span><div class="portal-password"><input id="portal-password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button type="button" class="portal-show" data-show-password="portal-password">Show</button></div><small class="field-error" data-error="password"></small></label>
<button class="btn navy-btn portal-login-btn" type="submit">Login</button><div id="login-notice" class="portal-status" aria-live="polite"></div>
</form><p class="portal-help">Your teacher account must be active and assigned to a class.</p><a class="portal-back muted" href="/">⌂ Back to Home</a>
</section></main><main id="dashboard-view" class="hidden portal-dashboard"><header class="portal-static-header"><div class="inner"><div class="portal-brand"><img src="/logo.jpg" alt="D'Blossom"><div><h1>Teacher Portal</h1><p id="teacher-subtitle">Class Management</p></div></div><button id="logout" class="btn btn-outline-light">Logout</button></div></header><div class="portal-dashboard-body"><div class="portal-mobile-nav" id="teacher-mobile-nav"></div><div class="portal-static-grid"><aside class="portal-static-sidebar" id="teacher-sidebar"><button class="active teacher-tab" data-tab="dashboard">📊 Dashboard</button><button class="teacher-tab" data-tab="students">🎓 Students</button><button class="teacher-tab" data-tab="results">📄 Results</button><button class="teacher-tab" data-tab="attendance">🗓️ Attendance</button><button class="teacher-tab" data-tab="materials">📚 Learning Materials</button><button class="teacher-tab" data-tab="lessons">📋 Lesson Plans</button><button class="teacher-tab" data-tab="performance">📈 Students Performance</button><button class="teacher-tab" data-tab="announcements">📢 Announcements</button><button class="teacher-tab" data-tab="messages">💬 Messages</button><button class="teacher-tab" data-tab="profile">👤 My Profile</button></aside><section class="portal-static-main" id="teacher-panel"><div class="portal-empty-card"><h2>Loading your portal…</h2><p>Please wait.</p></div></section></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>document.querySelectorAll("[data-show-password]").forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.showPassword);i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"Show":"Hide"});</script><script type="module" src="/js/portal.js?v=html-first-1"></script></body></html>
