<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admission Status — D'Blossom Model Private Schools</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css"></head><body><main class="login-main"><section class="login-card" style="margin-top:48px;max-width:620px"><img class="portal-logo" src="/logo.jpg" alt="D'Blossom Model Private Schools logo"><p class="eyebrow">D'Blossom Model Private Schools</p><h1 style="color:var(--navy)">Check Admission Status</h1><form id="status-form" class="dashboard-form"><input name="application_number" required placeholder="Application number"><button class="btn btn-gold">Check Status</button></form><div id="status-output"></div><p style="margin-top:18px"><a href="/pages/admissions.html">← Back to Admissions</a> · <a href="/">Home</a></p></section></main><script>document.querySelector("#status-form").onsubmit=async e=>{e.preventDefault();const o=document.querySelector("#status-output");o.className="notice";o.textContent="Checking…";try{const n=new URLSearchParams(new FormData(e.target)).get("application_number"),r=await fetch("/.netlify/functions/admission-status?application_number="+encodeURIComponent(n)),d=await r.json();if(!r.ok)throw Error(d.error||"Not found");o.innerHTML="<strong>Application: "+d.data.application_number+"</strong><p>Applicant: "+d.data.applicant_name+"</p><p>Class: "+(d.data.class_applied||"—")+"</p><p>Status: <strong>"+d.data.status+"</strong></p>"+(d.data.interview_date?"<p>Interview: "+new Date(d.data.interview_date).toLocaleString()+"</p>":"")}catch(x){o.className="notice danger";o.textContent=x.message}}</script></body></html>
