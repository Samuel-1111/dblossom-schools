<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admissions — D'Blossom Model Private Schools</title>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
<main class="login-main admissions-page">
<section class="login-card admission-card">
<div class="admission-heading">
<img class="admission-logo" src="/logo.jpg" alt="D'Blossom Model Private Schools logo">
<p class="eyebrow">D'Blossom Model Private Schools</p>
<h1>Online Admission Application</h1>
<p class="muted">Complete the form carefully. The school will review your application and contact you using the details provided.</p>
</div>
<form id="admission-form" class="dashboard-form admission-form">
<input name="applicant_name" required placeholder="Applicant full name">
<input name="date_of_birth" type="date">
<select name="gender"><option value="">Gender</option><option>Male</option><option>Female</option></select>
<input name="class_applied" placeholder="Class applying for">
<input name="parent_name" required placeholder="Parent/Guardian full name">
<input name="parent_email" type="email" placeholder="Parent email">
<input name="parent_phone" required type="tel" placeholder="Parent phone">
<textarea name="address" rows="3" placeholder="Address"></textarea>
<div class="admission-actions">
<button class="btn btn-gold" type="submit">Submit Application</button>
<button class="btn navy-btn" type="button" id="download-admission-pdf">Download Form as PDF</button>
</div>
<p id="admission-notice" class="notice"></p>
</form>
<p class="admission-links"><a href="/">← Back to Home</a> · <a href="/pages/admission-status.html">Check application status</a></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script type="module" src="/js/admissions.js"></script>
</body>
</html>
