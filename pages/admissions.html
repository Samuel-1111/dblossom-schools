<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admissions — D'Blossom Model Private Schools</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css"></head><body><main class="login-main"><section class="login-card" style="margin-top:48px;max-width:760px"><p class="eyebrow">D'Blossom Model Private Schools</p><h1 style="color:var(--navy)">Online Admission Application</h1><p class="muted">Complete the form and the school will review your application.</p><form id="admission-form" class="dashboard-form" style="margin-top:24px"><input name="applicant_name" required placeholder="Applicant full name"><input name="date_of_birth" type="date"><select name="gender"><option value="">Gender</option><option>Male</option><option>Female</option></select><input name="class_applied" placeholder="Class applying for"><input name="parent_name" required placeholder="Parent/Guardian full name"><input name="parent_email" type="email" placeholder="Parent email"><input name="parent_phone" placeholder="Parent phone"><textarea name="address" rows="3" placeholder="Address"></textarea><button class="btn btn-gold" type="submit">Submit Application</button><p id="admission-notice" class="notice"></p></form><p style="margin-top:18px"><a href="/">← Back to Home</a> · <a href="/pages/admission-status.html">Check application status</a></p></section></main><script type="module">const f=document.querySelector("#admission-form"),n=document.querySelector("#admission-notice");f.addEventListener("submit",async e=>{e.preventDefault();n.textContent="Submitting…";const data=Object.fromEntries(new FormData(f));try{const r=await fetch("/.netlify/functions/admissions",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(data)}),p=await r.json();if(!r.ok)throw Error(p.error||"Application could not be submitted.");n.textContent="Application submitted successfully. Application number: "+(p.data?.application_number||"generated");f.reset()}catch(x){n.textContent=x.message||"Application could not be submitted."}})</script></body></html>
