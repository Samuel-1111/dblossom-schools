name: Vanilla website check
on:
  push:
    branches: ["main","vanilla-html-css-js-migration"]
  pull_request:
    branches: ["main"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/vanilla-build-check.mjs
